name: sql-ai actions

on:
  push:
    branches-ignore:
      - "main"

concurrency:
  group: sql-ai
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      #----------------------------------------------
      #  -----  install & configure poetry  -----
      #----------------------------------------------
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install poetry export plugin
        run: poetry self add poetry-plugin-export
      #----------------------------------------------
      #       load cached venv if cache exists
      #----------------------------------------------
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      #----------------------------------------------
      # install dependencies if cache does not exist
      #----------------------------------------------
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root
      #----------------------------------------------
      #              run nox
      #----------------------------------------------
      - name: Run nox
        run: |
          source .venv/bin/activate
          nox
      
      #----------------------------------------------
      #              run code coverage
      #----------------------------------------------
      # Sanity check: ensure pytest-cov is importable before running tests
      - name: Sanity check pytest-cov installed
        run: poetry run python -c "import pytest_cov; print('pytest-cov OK')"

      # Run tests and generate coverage.xml for Codecov
      - name: Run tests & create coverage.xml
        run: poetry run pytest --cov=sql_ai --cov-report=xml --cov-report=term-missing

      # Show where coverage artifacts landed (useful when debugging CI)
      - name: Show coverage artifacts
        run: |
          ls -al
          find . -maxdepth 3 -name "coverage.xml" -o -name ".coverage*"

      # Upload the coverage.xml to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true
