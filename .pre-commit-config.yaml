repos:
  - repo: local
    hooks:
      - id: format-check
        name: Check maintained Python formatting scope
        language: system
        entry: make format-check
        pass_filenames: false
        stages: [pre-commit]

      - id: isort-check
        name: Check maintained Python import ordering scope
        language: system
        entry: make isort-check
        pass_filenames: false
        stages: [pre-commit]

      - id: lint
        name: Lint maintained Python scope
        language: system
        entry: make lint
        pass_filenames: false
        stages: [pre-commit]