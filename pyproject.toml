[project]
name = "sql-ai"
version = "0.0.1"
description = "Repo for converting natural language to SQL via a front end chatbot"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Tom Weisner", email = "tomweisner@hotmail.com" }]
requires-python = ">=3.11"

dependencies = [
  "streamlit>=1.45.1",
  "boto3>=1.38.31,<2.0.0",
  "pandas>=2.3.0",
  "pyyaml>=6.0.2",
  "sqlglot>=26.31.0",
  "python-docx>=1.2.0",
  "boto3-stubs[athena]>=1.39.3",
  "mypy-boto3-athena (>=1.40.0,<2.0.0)",
  "pytest-mock (>=3.14.1,<4.0.0)",
  "moto (>=5.1.9,<6.0.0)",
  "pytest-cov (>=7.0.0,<8.0.0)"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
  { include = "sql_ai", from = "src" }
]
scripts = { "sql-ai" = "sql_ai.streamlit.entrypoint:main" }

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
streamlit = "^1.46.1"
types-pyyaml = "^6.0.12.20250516"
nox = "^2025.5.1"
nox-poetry = "^1.0"
flake8-black = "^0.3.6"

[tool.poetry.group.test.dependencies]
nox-poetry = "^1.0"
pytest = "^8.0"


[tool.poetry.group.typing.dependencies]
black = "^24.4.1"
flake8 = "^7.0.0"
isort = "^5.13.2"
mypy = ">=1.10.0"
pandas-stubs = "^2.2.2"
types-pyyaml = "^6.0.12"
boto3-stubs = "^1.38.38"
streamlit = "^1.46.1"

[tool.mypy]
files = ["src/sql_ai", "tests"]
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["lner_package_template.*"]
ignore_missing_imports = true

[tool.mypy-streamlit]
ignore_missing_imports = true

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.black]
line-length = 90
target-version = ["py311"]
include = "\\.pyi?$"

[tool.pytest.ini_options]
markers = [
  "local_only: mark tests that should only run when on local machine"
]
